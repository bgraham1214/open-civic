name: Collect

on:
  push:
  pull_request:
  workflow_dispatch:     # "Run workflow" button
  schedule:
    - cron: "17 8 * * *" # nightly, 3:17 AM Eastern (standard time)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Offline tests (saved samples)
        run: python -m unittest discover -s tests -v

  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    concurrency: live-collection
    permissions:
      contents: write   # commit data/, upload file copies, update live-samples
    env:
      OCW_CONTACT: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: mkdir -p out/raw-archive out/raw-agendacenter out/files data/listings

      # --- 1. Listings. Written to out/ first; copied into data/ only on success. ---
      - name: CivicClerk schema check
        continue-on-error: true
        run: python -m opencivic.civicclerk check-schema --tenant templeterracefl 2>&1 | tee out/civicclerk-schema.txt
      - name: CivicClerk listing (agendas from Oct 2025)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m opencivic.civicclerk meetings -o out/civicclerk-meetings.jsonl 2>&1 | tee out/civicclerk-log.txt
          python -m opencivic.civicclerk files --format csv -o out/civicclerk-files.csv
          cp out/civicclerk-meetings.jsonl out/civicclerk-files.csv data/listings/
      - name: CivicClerk agenda items (sections, items, attachments)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m opencivic.civicclerk items --meetings out/civicclerk-meetings.jsonl \
            -o out/civicclerk-items.jsonl 2>&1 | tee out/civicclerk-items-log.txt
          test -s out/civicclerk-items.jsonl && cp out/civicclerk-items.jsonl data/listings/
      - name: Archive Center listing (City Council minutes)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m opencivic.archivecenter items --save-raw out/raw-archive -o out/archive-items.jsonl 2>&1 | tee out/archive-log.txt
          test -s out/archive-items.jsonl && cp out/archive-items.jsonl data/listings/

      # --- 2. Fingerprint every document and log changes (Phase 1, step 3). ---
      - name: Fingerprint and update manifest
        run: |
          python -m opencivic.manifest update \
            --civicclerk out/civicclerk-meetings.jsonl --archive out/archive-items.jsonl \
            --data-dir data --store-dir out/files \
            --copy-base "https://github.com/${{ github.repository }}/releases/download/files" \
            2>&1 | tee out/manifest-log.txt

      - name: Keep copies of new files in the "files" release
        run: |
          gh release view files >/dev/null 2>&1 || gh release create files \
            --title "Document copies" \
            --notes "Copies of every published document version, named by SHA-256. See data/manifest.jsonl."
          existing=$(gh release view files --json assets -q '.assets[].name')
          uploaded=0
          for f in out/files/*; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            if ! grep -qx "$n" <<<"$existing"; then gh release upload files "$f"; uploaded=$((uploaded+1)); fi
          done
          echo "uploaded $uploaded new file(s)" | tee -a out/manifest-log.txt

      # --- 3. Text, page by page; OCR for scanned pages (Phase 1, step 4). ---
      - name: Install PDF and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Extract text
        continue-on-error: true
        run: python -m opencivic.extract --data-dir data --files-dir out/files --max-ocr-pages 600 2>&1 | tee out/extract-log.txt

      - name: Commit data/ (listings, manifest, state, text)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -q -m "Collect $(date -u +%Y-%m-%d): $(tail -n 2 out/manifest-log.txt | head -n 1)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

      # --- 4. Public search site on GitHub Pages (Phase 1, step 5). ---
      - name: Build site
        run: |
          python -m opencivic.build --data-dir data --out site \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          size=$(stat -c %s site/templeterrace.db); echo "database: $size bytes"
          if [ "$size" -gt 95000000 ]; then echo "::error::database over GitHub's 100 MB file limit"; exit 1; fi
      - name: Publish to gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Site build ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages

      # --- 5. Exploration: save the AgendaCenter (possible home of pre-Oct 2025 records). ---
      - name: Capture AgendaCenter pages
        continue-on-error: true
        run: |
          python - <<'EOF' 2>&1 | tee out/agendacenter-log.txt
          from opencivic.fetch import HttpFetcher, FetchError
          f = HttpFetcher()
          site = "https://www.templeterrace.gov"
          pages = {
              "index.html": f"{site}/AgendaCenter",
              "search-2015-2025.html": f"{site}/AgendaCenter/Search/?term=&CIDs=all&startDate=01/01/2015&endDate=12/31/2025&dateRange=&dateSelector=",
          }
          for name, url in pages.items():
              try:
                  text = f.get_text(url)
                  open(f"out/raw-agendacenter/{name}", "w").write(text)
                  print(name, len(text), "chars,", text.count("ViewFile"), "ViewFile links")
              except FetchError as e:
                  print(name, "failed:", e)
          EOF

      # Results (minus the file copies) go to the live-samples branch for easy reading.
      - name: Save results to live-samples branch
        if: always()
        run: |
          rm -rf out/files
          cd out
          git init -q -b live-samples
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Live collection ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" live-samples
