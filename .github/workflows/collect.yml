name: Collect

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button: live collection from Temple Terrace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Offline tests (saved samples)
        run: python -m unittest discover -s tests -v

  live:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      OCW_CONTACT: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: mkdir -p out/raw-archive

      # --- CivicClerk (agendas from Oct 2025) ---
      - name: CivicClerk schema check
        continue-on-error: true
        run: python -m opencivic.civicclerk check-schema --tenant templeterracefl 2>&1 | tee out/civicclerk-schema.txt
      - name: CivicClerk listing (all pages)
        continue-on-error: true
        run: |
          python -m opencivic.civicclerk meetings -o out/civicclerk-meetings.jsonl
          python -m opencivic.civicclerk files --format csv -o out/civicclerk-files.csv
      - name: CivicClerk download check
        continue-on-error: true
        run: |
          python - <<'EOF' 2>&1 | tee out/civicclerk-download-check.txt
          import csv
          from opencivic.fetch import HttpFetcher
          row = next(csv.DictReader(open("out/civicclerk-files.csv")))
          data = HttpFetcher().get_bytes(row["download_url"])
          print(row["name"], len(data), "bytes, starts with", data[:8])
          assert data.startswith(b"%PDF"), "download_url did not return a PDF"
          EOF

      # --- Archive Center (minutes, agendas before Oct 2025) ---
      - name: Archive Center listing (saves raw HTML for test fixtures)
        continue-on-error: true
        run: python -m opencivic.archivecenter items --save-raw out/raw-archive -o out/archive-items.jsonl 2>&1 | tee out/archive-log.txt
      - name: Archive Center download check
        continue-on-error: true
        run: |
          python - <<'EOF' 2>&1 | tee out/archive-download-check.txt
          import json
          from opencivic.fetch import HttpFetcher
          item = json.loads(open("out/archive-items.jsonl").readline())
          data = HttpFetcher().get_bytes(item["url"])
          print(item["title"], len(data), "bytes, starts with", data[:8])
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: templeterrace-live
          path: out/
